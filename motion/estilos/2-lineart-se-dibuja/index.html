<!doctype html>

    <title>Estilo 2 · Line art que se dibuja</title>
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.15.0/dist/gsap.min.js"></script>
    <style>
@font-face { font-family: "Fraunces"; font-weight: 600; src: url("assets/fonts/Fraunces-600.woff2") format("woff2"); }
@font-face { font-family: "Inter"; font-weight: 500; src: url("assets/fonts/Inter-500.woff2") format("woff2"); }
:root { --blanco:#FFFEFE; --beige:#EED3BB; --arena:#D7B18F; --verde:#3F4A3A; --tinta:#1A1A1A; --borgona:#7D4F6A; --rosado:#F4D5DC; }
* { margin:0; padding:0; box-sizing:border-box; }
html, body { width:1080px; height:1920px; overflow:hidden; background:var(--blanco); }
#root { position:relative; width:100%; height:100%; overflow:hidden; background:var(--blanco); }
.capa { position:absolute; inset:0; }
.frase { position:absolute; left:92px; top:150px; width:800px; font-family:"Fraunces",serif; font-weight:600;
         font-size:76px; line-height:1.4; color:var(--tinta); }
.frase .p { display:inline-block; opacity:0; }
.frase .k { color:var(--borgona); }
.etq { font-family:"Inter",sans-serif; font-weight:500; letter-spacing:0.14em; text-transform:uppercase; }

svg { position:absolute; inset:0; }
.tr { fill:none; stroke:#1A1A1A; stroke-width:3; stroke-linecap:round; stroke-dasharray:1; stroke-dashoffset:1; }
#marco { fill:none; stroke:#D7B18F; stroke-width:9; stroke-dasharray:1; stroke-dashoffset:1; }
#luzpiso { fill:rgba(255,236,205,.0); }
.dani { position:absolute; left:0; width:1080px; height:1920px; opacity:0; }
#veladura { background:var(--beige); mix-blend-mode:multiply; opacity:0; }
#b8 { top:330px; color:var(--borgona); }</style>
  </head>
  <body>
    <div id="root" data-composition-id="main" data-start="0" data-duration="26" data-width="1080" data-height="1920">

      <div id="escena" class="clip capa" data-start="0" data-duration="26" data-track-index="0">
        <svg viewBox="0 0 1080 1920" width="1080" height="1920">
          <polygon id="luzpiso" points="700,1010 1000,1090 1080,1700 640,1500" />

<path class="tr" d="M 330 980 L 330 470" pathLength="1" />
<path class="tr" d="M 330 980 L 1080 1330" pathLength="1" />
<path class="tr" d="M 0 1420 L 520 1060" pathLength="1" />
<path class="tr" d="M 0 1610 L 700 1140" pathLength="1" />
<path class="tr" d="M 0 1800 L 880 1220" pathLength="1" />
<path class="tr" d="M 160 1920 L 1060 1300" pathLength="1" />
<path class="tr" d="M 440 1920 L 1080 1480" pathLength="1" />
<path class="tr" d="M 720 1920 L 1080 1680" pathLength="1" />
<path class="tr" d="M 700 530 L 1000 610 L 1000 1090 L 700 1010 Z" pathLength="1" />
<path class="tr" d="M 850 570 L 850 1050" pathLength="1" />
<path class="tr" d="M 700 770 L 1000 850" pathLength="1" />
<path class="tr" d="M 660 480 L 1040 580" pathLength="1" />
          <path id="marco" d="M 700 530 L 1000 610 L 1000 1090 L 700 1010 Z" pathLength="1" />
          <g id="cortina"><path class="tr cort" d="M 680 492 C 700 650 660 830 690 1050" pathLength="1" />
<path class="tr cort" d="M 720 502 C 740 660 700 840 728 1060" pathLength="1" />
<path class="tr cort" d="M 760 513 C 775 670 745 850 765 1070" pathLength="1" /></g>
        </svg>
        <img id="d_cerrados" class="dani" src="assets/r2_cama-lado_ojos-cerrados.png" style="top:200px" alt="" />
        <img id="d_abiertos" class="dani" src="assets/r2_cama-lado_ojos-abiertos.png" style="top:200px" alt="" />
        <img id="d_arriba" class="dani" src="assets/r2_borde-cama_hombros-arriba.png" style="top:0px" alt="" />

        <span class="mota" id="m1" style="position:absolute;left:760px;top:520px;width:6px;height:6px;border-radius:50%;background:rgba(255,244,222,.95);box-shadow:0 0 10px rgba(255,226,180,.9);opacity:0"></span>
<span class="mota" id="m2" style="position:absolute;left:840px;top:640px;width:6px;height:6px;border-radius:50%;background:rgba(255,244,222,.95);box-shadow:0 0 10px rgba(255,226,180,.9);opacity:0"></span>
<span class="mota" id="m3" style="position:absolute;left:720px;top:700px;width:6px;height:6px;border-radius:50%;background:rgba(255,244,222,.95);box-shadow:0 0 10px rgba(255,226,180,.9);opacity:0"></span>
<span class="mota" id="m4" style="position:absolute;left:900px;top:760px;width:6px;height:6px;border-radius:50%;background:rgba(255,244,222,.95);box-shadow:0 0 10px rgba(255,226,180,.9);opacity:0"></span>
<span class="mota" id="m5" style="position:absolute;left:800px;top:900px;width:6px;height:6px;border-radius:50%;background:rgba(255,244,222,.95);box-shadow:0 0 10px rgba(255,226,180,.9);opacity:0"></span>
<span class="mota" id="m6" style="position:absolute;left:950px;top:560px;width:6px;height:6px;border-radius:50%;background:rgba(255,244,222,.95);box-shadow:0 0 10px rgba(255,226,180,.9);opacity:0"></span>
<span class="mota" id="m7" style="position:absolute;left:690px;top:980px;width:6px;height:6px;border-radius:50%;background:rgba(255,244,222,.95);box-shadow:0 0 10px rgba(255,226,180,.9);opacity:0"></span>
<span class="mota" id="m8" style="position:absolute;left:870px;top:1040px;width:6px;height:6px;border-radius:50%;background:rgba(255,244,222,.95);box-shadow:0 0 10px rgba(255,226,180,.9);opacity:0"></span>

<div id="b1" class="frase clip " data-start="0.8" data-duration="3.4" data-track-index="2"><span class="p">Dormí</span> <span class="p">todo</span> <span class="p">el</span> <span class="p">fin</span> <span class="p">de</span> <span class="p">semana.</span></div>
<div id="b2" class="frase clip " data-start="3.7" data-duration="4.1" data-track-index="2"><span class="p">Llegó</span> <span class="p">el</span> <span class="p">lunes</span> <span class="p">y</span> <span class="p">amanecí</span> <span class="p">igual</span> <span class="p">de</span> <span class="p k">vacía.</span></div>
<div id="b3" class="frase clip " data-start="7.3" data-duration="2.9" data-track-index="2"><span class="p">No</span> <span class="p">es</span> <span class="p">sueño</span> <span class="p">atrasado.</span></div>
<div id="b4" class="frase clip " data-start="9.7" data-duration="2.9" data-track-index="2"><span class="p">Dormir</span> <span class="p">no</span> <span class="p">lo</span> <span class="p">repone.</span></div>
<div id="b5" class="frase clip " data-start="12.1" data-duration="4.1" data-track-index="2"><span class="p">Estoy</span> <span class="p">funcionando</span> <span class="p">—</span> <span class="p">pero</span> <span class="p k">no</span> <span class="p k">estoy.</span></div>
<div id="b6" class="frase clip " data-start="15.7" data-duration="3.5" data-track-index="2"><span class="p">Quizá</span> <span class="p">no</span> <span class="p">necesito</span> <span class="p">descansar</span> <span class="p">más.</span></div>
<div id="b7" class="frase clip " data-start="18.7" data-duration="3.7" data-track-index="2"><span class="p">Quizá</span> <span class="p">esto</span> <span class="p">que</span> <span class="p">cargo</span> <span class="p">tiene</span> <span class="p">otra</span> <span class="p">forma,</span></div>
<div id="b8" class="frase clip " data-start="21.9" data-duration="4.1" data-track-index="2"><span class="p">y</span> <span class="p">todavía</span> <span class="p">no</span> <span class="p">tiene</span> <span class="p">nombre.</span></div>
    </div>
    <script>

const tl = gsap.timeline({ paused: true });
// Texto de marca: palabra por palabra (0,12 s, 0,65 s, subida 18 px) y salida con fundido de 0,5 s
function frase(sel, ini, fin, opts) {
  opts = opts || {};
  tl.fromTo(sel + " .p", { opacity: 0, y: opts.sube ?? 18 }, { opacity: 1, y: 0, duration: 0.65, stagger: opts.stagger ?? 0.12, ease: "power2.out" }, ini);
  if (fin !== null && fin !== undefined) {
    if (opts.salida) opts.salida(sel, fin);
    else tl.to(sel + " .p", { opacity: 0, duration: 0.5, ease: "power1.in" }, fin);
  }
}
// Polvo en la luz: trayectorias fijas (deterministas)
function polvo(prefijo, n, t0) {
  for (let i = 1; i <= n; i++) {
    const dx = ((i * 37) % 60) - 30, dy = -40 - ((i * 23) % 60);
    tl.fromTo("#" + prefijo + i, { opacity: 0, x: 0, y: 0 }, { opacity: 0.9, duration: 1.6, ease: "sine.out" }, t0 + 0.25 * i);
    tl.to("#" + prefijo + i, { x: dx, y: dy, duration: 26 - t0 - 0.25 * i - 0.1, ease: "sine.inOut" }, t0 + 0.25 * i);
  }
}


// 1) El dormitorio se dibuja en line art
tl.to(".tr:not(.cort)", { strokeDashoffset: 0, duration: 1.1, stagger: 0.08, ease: "power2.inOut" }, 0);
tl.to("#marco", { strokeDashoffset: 0, duration: 1.0, ease: "power2.inOut" }, 0.9);
tl.to(".cort", { strokeDashoffset: 0, duration: 1.0, stagger: 0.1, ease: "power2.out" }, 1.1);
tl.to("#luzpiso", { fill: "rgba(255,236,205,.55)", duration: 2.0, ease: "sine.inOut" }, 1.6);
// 2) Dani llega a todo color (la única con detalle)
tl.fromTo("#d_cerrados", { opacity: 0, scale: 0.98 }, { opacity: 1, scale: 1, duration: 1.2, ease: "power2.out" }, 1.4);
tl.to("#d_abiertos", { opacity: 1, duration: 0.5 }, 4.6);           // "Llegó el lunes": abre los ojos
tl.to("#d_cerrados", { opacity: 0, duration: 0.5 }, 4.6);
// 3) Cambio de plano: borde de la cama
tl.to("#d_abiertos", { opacity: 0, duration: 0.6 }, 7.0);
tl.to("#d_arriba", { opacity: 1, duration: 0.6 }, 7.0);
tl.to("#d_abajo", { opacity: 1, duration: 0.6 }, 13.6);             // "pero no estoy": los hombros caen
tl.to("#d_arriba", { opacity: 0, duration: 0.6 }, 13.6);
// Cortina que se mece (finito) y luz que respira
tl.to("#cortina", { x: 10, duration: 2.5, ease: "sine.inOut", yoyo: true, repeat: 9 }, 2.0);
tl.to("#luzpiso", { opacity: 0.6, duration: 2.2, ease: "sine.inOut", yoyo: true, repeat: 8 }, 4.0);
polvo("m", 8, 2.0);
// Cámara con deriva leve
tl.fromTo("#escena", { scale: 1.0 }, { scale: 1.08, x: -14, duration: 26, ease: "none" }, 0);
// Cierre: la luz baja con veladura cálida
tl.to("#veladura", { opacity: 0.4, duration: 1.5, ease: "sine.inOut" }, 21.3);
frase("#b1", 0.9, 3.6);
frase("#b2", 3.8, 7.2);
frase("#b3", 7.4, 9.6);
frase("#b4", 9.8, 12.0);
frase("#b5", 12.2, 15.6);
frase("#b6", 15.8, 18.6);
frase("#b7", 18.8, 21.8);
frase("#b8", 22.0, null);
      window.__timelines["main"] = tl;
      tl.seek(0);
    </script>
