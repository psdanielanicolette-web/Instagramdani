  </style>

  <div id="root" data-composition-id="cama" data-width="1080" data-height="1920">
    <!-- ESCENA -->
    <div id="cama-cam">
      <img id="cama-fondo" src="assets/cama/fondo.png" alt="" />
      <!-- Pendiente: ojos cerrados (0-7,7 s) y abiertos (9,0 s) cuando lleguen de Flow.

      <img id="cama-respira" src="assets/cama/respira.png" alt="" />
      <img id="cama-cortina" src="assets/cama/cortina.png" alt="" />

      <svg id="cama-luz" width="1080" height="1920" viewBox="0 0 1080 1920">
        <defs>
          <linearGradient id="cama-haz-g" x1="1" y1="0" x2="0" y2="1">

        <polygon

    <!-- FIJO -->
    <div id="cama-velo"></div>

    <div id="cama-f1" class="clip cama-frase" data-start="0.9" data-duration="4.8" data-track-index="1">
      <div class="in"><span class="p">Dormí</span><span class="p">todo</span><span class="p">el</span><span class="p">fin</span><span class="p">de</span><span class="p">semana.</span></div>
    </div>
    <div id="cama-f2" class="clip cama-frase" data-start="6.7" data-duration="2.3" data-track-index="1">
      <div class="in"><span class="p">Llegó</span><span class="p">el</span><span class="p">lunes</span></div>
    </div>
    <div id="cama-f3" class="clip cama-frase" data-start="9.2" data-duration="3.15" data-track-index="1">
      <div class="in"><span class="p">y</span><span class="p">amanecí</span><span class="p">igual</span><span class="p">de</span><span class="p">vacía.</span></div>
    </div>

    <div id="cama-intro" class="clip" data-start="0" data-duration="1.7" data-track-index="2">
      <svg id="cama-obt" width="1080" height="1920" viewBox="0 0 1080 1920">
        <defs>
          <mask id="cama-hueco">
            <rect width="1080" height="1920" fill="white" />
            <polygon id="cama-hueco-p" points="540,960 540,960 540,960" fill="black" />
          </mask>
        </defs>
        <rect width="1080" height="1920" fill="#FCFBF9" mask="url(#cama-hueco)" />
        <g id="cama-hojas" stroke="#2D2825" stroke-width="1.3" opacity="0.8"></g>
      </svg>
      <div id="cama-arriba" class="cama-mitad" style="top: 0; height: 960px">
        <svg id="cama-pa" width="1080" height="960" viewBox="0 0 1080 960"></svg>
      </div>
      <div id="cama-abajo" class="cama-mitad" style="bottom: 0; height: 960px">
        <svg id="cama-pb" width="1080" height="960" viewBox="0 0 1080 960" style="position: absolute; bottom: 0"></svg>
      </div>

  </div>

  <script>
    (() => {
      const D = 12.4;
      const $ = (id) => document.getElementById(id);
      const NS = "http://www.w3.org/2000/svg";
      const TINTA = "#2D2825";
      const LAMINA = "#FCFBF9";

      // ---------- persiana: láminas, cuerdas, cordón y borla ----------
      function persiana(svg, n, arriba) {
        const fondo = document.createElementNS(NS, "rect");
        fondo.setAttribute("width", 1080);
        fondo.setAttribute("height", 960);
        fondo.setAttribute("fill", LAMINA);
        svg.appendChild(fondo);
        const g = document.createElementNS(NS, "g");
        g.setAttribute("class", "laminas");
        for (let i = 0; i <= n; i++) {
          const l = document.createElementNS(NS, "line");
          l.setAttribute("x1", 0);
          l.setAttribute("x2", 1080);
          l.setAttribute("stroke", TINTA);
          l.setAttribute("stroke-width", 1.4);
          l.setAttribute("opacity", 0.75);
          l.dataset.i = i;
          g.appendChild(l);
        }
        svg.appendChild(g);
        [0.12, 0.4, 0.72].forEach((c) => {
          const l = document.createElementNS(NS, "line");
          l.setAttribute("x1", c * 1080);
          l.setAttribute("x2", c * 1080);
          l.setAttribute("y1", 0);
          l.setAttribute("y2", 960);
          l.setAttribute("stroke", TINTA);
          l.setAttribute("stroke-width", 0.8);
          l.setAttribute("opacity", 0.45);
          svg.appendChild(l);
        });
        if (arriba) {
          const c = document.createElementNS(NS, "line");
          c.setAttribute("id", "cama-cordon");
          c.setAttribute("x1", 65);
          c.setAttribute("x2", 65);
          c.setAttribute("y1", 0);
          c.setAttribute("stroke", TINTA);
          c.setAttribute("stroke-width", 1.2);
          svg.appendChild(c);
          const b = document.createElementNS(NS, "rect");
          b.setAttribute("id", "cama-borla");
          b.setAttribute("x", 58);
          b.setAttribute("width", 14);
          b.setAttribute("height", 30);
          b.setAttribute("rx", 6);
          b.setAttribute("fill", LAMINA);
          b.setAttribute("stroke", TINTA);
          b.setAttribute("stroke-width", 1.4);
          svg.appendChild(b);
        }
      }
      persiana($("cama-pa"), 15, true);
      persiana($("cama-pb"), 12, false);
      for (let i = 0; i < 8; i++) {
        const l = document.createElementNS(NS, "line");
        $("cama-hojas").appendChild(l);
      }

      // ---------- utilidades ----------
      const clamp = (v, a, b) => Math.min(b, Math.max(a, v));
      const io3 = (x) => (x < 0.5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2);
      const io2 = (x) => (x < 0.5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2);
      const k = (t, a, b) => clamp((t - a) / (b - a), 0, 1);
      function claves(t, ks) {
        if (t <= ks[0].t) return ks[0];
        for (let i = 1; i < ks.length; i++) {
          if (t <= ks[i].t) {
            const p = io2(k(t, ks[i - 1].t, ks[i].t));
            const a = ks[i - 1], b = ks[i];
            return { x: a.x + (b.x - a.x) * p, y: a.y + (b.y - a.y) * p, z: a.z + (b.z - a.z) * p };
          }
        }
        return ks[ks.length - 1];
      }

      // cámara (coordenadas del cuadro; centro de la zona de escena = 540, 1220)
      const CAM = [
        { t: 0, x: 540, y: 1220, z: 1.0 },
        { t: 6.0, x: 580, y: 1180, z: 1.06 },
        { t: 6.6, x: 620, y: 1120, z: 1.1 },
        { t: 12.4, x: 743, y: 1029, z: 1.3 },
      ];

      function render(t) {
        // cámara con deriva leve
        const c = claves(t, CAM);
        const z = Math.min(1.3, c.z);
        const tx = 540 - c.x * z + 6 * Math.sin(0.7 * t);
        const ty = 1220 - c.y * z + 3.6 * Math.cos(0.53 * t);
        $("cama-cam").style.transform = `translate(${tx}px, ${ty}px) scale(${z})`;

        // AMBIENTE VIVO · siempre: la cortina; entra: Dani respira y la luz viaja; la planta se mece
        const sk = 1.6 * Math.sin((2 * Math.PI * t) / 5) + 0.5 * Math.sin((2 * Math.PI * t) / 2.3);
        $("cama-cortina").style.transform = `skewX(${sk}deg)`;
        const rp = 1.8 * Math.sin((2 * Math.PI * t) / 4.6 + 0.8);
        $("cama-planta").style.transform = `rotate(${rp}deg)`;
        const br = 1 + 0.006 * (0.5 - 0.5 * Math.cos((2 * Math.PI * t) / 4.2));
        $("cama-respira").style.transform = `scale(${br}, ${1 + (br - 1) * 1.4})`;
        const viaje = -260 * io2(k(t, 0, 6));
        const resp = 0.62 * (1 + 0.05 * Math.sin((2 * Math.PI * t) / 6.5));
        const haz = $("cama-haz");
        haz.setAttribute("transform", `translate(${viaje},0)`);
        haz.setAttribute("opacity", resp.toFixed(3));

        // "apagón": la luz baja entre el fin de semana y el lunes (veladura cálida, nunca gris)
        const ap = t < 6.2 ? k(t, 5.8, 6.2) : 1 - k(t, 6.2, 6.7);
        $("cama-velo").style.opacity = (0.35 * ap).toFixed(3);

        // INTRO · persiana (0,12 → 1,25 s) + obturador (aparece 0,28 s; abre 0,50 → 1,05 s)
        const abre = io3(k(t, 0.12, 1.25));
        const alto = 960 * (1 - abre * 0.97);
        $("cama-arriba").style.height = `${alto}px`;
        $("cama-abajo").style.height = `${alto}px`;
        const paso = (n) => (960 / n) * (1 - abre * 0.82);
        $("cama-pa").querySelectorAll(".laminas line").forEach((l) => {
          const y = l.dataset.i * paso(15);
          l.setAttribute("y1", y);
          l.setAttribute("y2", y);
        });
        $("cama-pb").querySelectorAll(".laminas line").forEach((l) => {
          const y = 960 - l.dataset.i * paso(12);
          l.setAttribute("y1", y);
          l.setAttribute("y2", y);
        });
        $("cama-cordon").setAttribute("y2", Math.max(0, alto - 40));
        $("cama-borla").setAttribute("y", Math.max(0, alto - 42));
        const ap2 = io2(k(t, 0.5, 1.05));
        const R = ap2 * 1250;
        const giro = ap2 * 40;
        $("cama-obt").style.opacity = t >= 0.28 && ap2 < 1 ? 1 : 0;
        const vs = [];
        for (let i = 0; i < 8; i++) {
          const a = ((i * 45 + giro) * Math.PI) / 180;
          vs.push([540 + Math.cos(a) * R, 960 + Math.sin(a) * R]);
        }
        $("cama-hueco-p").setAttribute("points", vs.map((v) => v.join(",")).join(" "));
        $("cama-hojas").querySelectorAll("line").forEach((l, i) => {
          const a = ((i * 45 + giro + 112) * Math.PI) / 180;
          const [x, y] = vs[i];
          l.setAttribute("x1", x);
          l.setAttribute("y1", y);
          l.setAttribute("x2", x + Math.cos(a) * 1800);
          l.setAttribute("y2", y + Math.sin(a) * 1800);
        });
      }

      const tl = gsap.timeline({ paused: true });
      const reloj = { t: 0 };
      tl.to(reloj, { t: D, duration: D, ease: "none", onUpdate: () => render(reloj.t) }, 0);

      // TEXTO · palabra por palabra (0,12 s; 0,65 s; +18 px) y salida en 0,5 s
      [
        ["#cama-f1", 0.9, 5.7],
        ["#cama-f2", 6.7, 9.0],
        ["#cama-f3", 9.2, 12.35],
      ].forEach(([sel, a, b]) => {
        tl.fromTo(
          `${sel} .p`,
          { opacity: 0, y: 18 },
          { opacity: 1, y: 0, duration: 0.65, ease: "power3.out", stagger: 0.12 },
          a,
        );
        tl.fromTo(`${sel} .in`, { opacity: 1 }, { opacity: 0, duration: 0.5, ease: "power1.in" }, b - 0.5);
      });

      render(0);
      window.__timelines["cama"] = tl;
    })();
  </script>
